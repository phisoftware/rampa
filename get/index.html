<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rampa'yı indir</title>
<meta name="description" content="Rampa: off-road videona gerçek eğimi çizer. iPhone ve Android.">
<meta property="og:title" content="Rampa: Offroad Eğim Videosu">
<meta property="og:description" content="Videoda yokuş düz görünmesin. iPhone ve Android'de ücretsiz.">
<meta property="og:image" content="https://phisoftware.github.io/rampa/icon.png">
<link rel="icon" href="../icon.png">
<script>
  // Tek bağlantı, iki mağaza: iPhone → App Store (Instagram özel sayfası), Android → Google Play.
  // Kaynak: ?src=instagram (varsayılan). Başka kaynak için ?src=tiktok gibi; Play'de utm_source olarak görünür.
  (function () {
    var src = (new URLSearchParams(location.search).get("src") || "instagram").replace(/[^a-z0-9_-]/gi, "");
    // App Store kampanya bağlantısı: pt = hesap (provider) kodu, ct = kaynak → Analytics › Kampanyalar'da ayrı satır.
    var ios = "https://apps.apple.com/app/id6819189459?ppid=c1b99690-1d07-4501-80bf-0a4e09aee9b0&pt=119007264&ct=" + src + "&mt=8";
    var android = "https://play.google.com/store/apps/details?id=com.phisoftware.rampa.app&referrer=" +
      encodeURIComponent("utm_source=" + src + "&utm_medium=social");
    window.RAMPA = { ios: ios, android: android };
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (ua.indexOf("Macintosh") > -1 && navigator.maxTouchPoints > 1);
    if (isIOS) location.replace(ios);
    else if (/Android/i.test(ua)) location.replace(android);
  })();
</script>
<style>
  :root { --bg: #f6f3ef; --fg: #1b1714; --muted: #6d655e; --card: #fff; --accent: #f28c28; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141210; --fg: #f4efe9; --muted: #a39a91; --card: #1f1c19; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { max-width: 420px; width: 100%; text-align: center; }
  img.icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  h1 { font-size: 26px; margin: 18px 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; padding: 14px 18px; margin: 10px 0; border-radius: 14px; background: var(--card);
          color: var(--fg); text-decoration: none; font-weight: 600; border: 1px solid rgba(127,127,127,.25); }
  a.btn:hover { border-color: var(--accent); }
  a.site { color: var(--accent); font-size: 14px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="../icon.png" alt="Rampa">
  <h1>Rampa</h1>
  <p>Videoda yokuş düz görünmesin. · Show the real slope on video.</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/id6819189459"> App Store · iPhone</a>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.phisoftware.rampa.app">▶ Google Play · Android</a>
  <a class="site" href="../">phisoftware.github.io/rampa</a>
</main>
<script>
  if (window.RAMPA) { document.getElementById("ios").href = RAMPA.ios; document.getElementById("android").href = RAMPA.android; }
</script>
</body>
</html>
