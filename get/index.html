<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rampa'yı indir</title>
<meta name="description" content="Rampa: off-road videona gerçek eğimi çizer. iPhone ve Android.">
<meta property="og:title" content="Rampa: Offroad Eğim Videosu">
<meta property="og:description" content="Videoda yokuş düz görünmesin. iPhone ve Android'de ücretsiz.">
<meta property="og:image" content="https://phisoftware.github.io/rampa/img/og.jpg">
<link rel="icon" href="../icon.png">
<script>
  // Tek bağlantı (fenomenler, Instagram biyografisi): 23.10.2026'dan beri /indir sayfasına aktarır; o sayfa telefonda bir
  // kez kendiliğinden mağazaya gider, dönen tanıtımı görür. Kaynak ?src= (varsayılan instagram), sayım /get/<kaynak>/<platform>.
  (function () {
    var q = new URLSearchParams(location.search);
    q.set("src", (q.get("src") || "instagram").replace(/[^a-z0-9_-]/gi, "").slice(0, 40) || "instagram");
    q.set("via", "get");
    location.replace("../indir/?" + q.toString());
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../indir/?src=instagram&amp;via=get"></noscript>
</head>
<body style="background:#0E1012"></body>
</html>
