<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rampa kulüp daveti</title>
<meta name="description" content="Rampa'da kulübe katıl: kulübün rozeti off-road videolarında ve araç kartında görünür.">
<meta property="og:title" content="Rampa kulüp daveti">
<meta property="og:description" content="Kulübe katıl: rozet videolarında ve araç kartında. iPhone ve Android'de ücretsiz.">
<meta property="og:image" content="https://phisoftware.github.io/rampa/icon.png">
<link rel="icon" href="../icon.png">
<style>
  :root { --bg: #f6f3ef; --fg: #1b1714; --muted: #6d655e; --card: #fff; --accent: #f28c28; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141210; --fg: #f4efe9; --muted: #a39a91; --card: #1f1c19; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { max-width: 420px; width: 100%; text-align: center; }
  img.icon { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .badge { display: inline-flex; align-items: center; gap: 12px; margin: 22px 0 8px; padding: 10px 18px 10px 10px; border-radius: 16px;
           color: #fff; background: #2F9E6B; text-align: left; max-width: 100%; }
  .tile { width: 46px; height: 46px; border-radius: 12px; background: rgba(0,0,0,.25); display: grid; place-items: center; font-weight: 900; font-size: 17px; flex: none; }
  .name { font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
  .sub { font-size: 13px; opacity: .9; }
  p { color: var(--muted); margin: 8px 0 22px; }
  a.btn { display: block; padding: 14px 18px; margin: 10px 0; border-radius: 14px; background: var(--card); color: var(--fg);
          text-decoration: none; font-weight: 600; border: 1px solid rgba(127,127,127,.25); }
  a.primary { background: var(--accent); color: #111; border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="icon" src="../icon.png" alt="Rampa">
  <div class="badge" id="badge" hidden>
    <span class="tile" id="initials"></span>
    <span><span class="name" id="name"></span><br><span class="sub" id="sub"></span></span>
  </div>
  <p id="text">Kulübe katılmak için Rampa'yı aç. Kulübün rozeti off-road videolarında ve araç kartında görünür.</p>
  <a class="btn primary" id="open" href="#">Rampa'da aç ve katıl</a>
  <a class="btn" id="ios" href="https://apps.apple.com/app/id6819189459?pt=119007264&ct=kulup&mt=8"> App Store · iPhone</a>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.phisoftware.rampa.app&referrer=utm_source%3Dkulup%26utm_medium%3Dqr">▶ Google Play · Android</a>
</main>
<script>
  // Kulüp bilgisi bağlantının # kısmında (sunucuya gitmez): Rampa'yı rampa://club?d=… ile açar.
  (function () {
    var data = location.hash.slice(1);
    var app = "rampa://club?d=" + data;
    document.getElementById("open").href = app;
    // Veri: <kulüp>[.<logo>] (logo 48 px JPEG, base64url).
    var parts = data.split(".");
    try {
      var json = JSON.parse(decodeURIComponent(escape(atob(parts[0].replace(/-/g, "+").replace(/_/g, "/")))));
      document.getElementById("badge").hidden = false;
      document.getElementById("badge").style.background = "#" + String(json.c || "2F9E6B").replace(/[^0-9a-fA-F]/g, "").slice(0, 6);
      document.getElementById("initials").textContent = json.s || "";
      if (parts[1] && /^[A-Za-z0-9_-]+$/.test(parts[1])) {
        var logo = new Image();
        logo.alt = "";
        logo.src = "data:image/jpeg;base64," + parts[1].replace(/-/g, "+").replace(/_/g, "/");
        logo.style.cssText = "width:100%;height:100%;border-radius:12px;object-fit:cover";
        var tile = document.getElementById("initials");
        tile.textContent = "";
        tile.appendChild(logo);
      }
      document.getElementById("name").textContent = json.n || "";
      document.getElementById("sub").textContent = [json.e, json.h].filter(Boolean).join(" · ");
      document.title = (json.n || "Kulüp") + " · Rampa";
    } catch (e) {}
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (ua.indexOf("Macintosh") > -1 && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) document.getElementById("android").hidden = true;
    if (isAndroid) document.getElementById("ios").hidden = true;
    // Sayaç (GoatCounter, çerezsiz): /kulup/<platform>.
    var platform = isIOS ? "ios" : isAndroid ? "android" : "web";
    new Image().src = "https://rampaoffroad.goatcounter.com/count?p=" + encodeURIComponent("/kulup/" + platform) +
      "&t=" + encodeURIComponent("Kulüp daveti") + "&rnd=" + Math.random().toString(36).slice(2);
    // Telefonda Rampa'yı hemen açmayı dene; yüklü değilse sayfa kalır, mağaza düğmeleri görünür.
    if (data && (isIOS || isAndroid)) setTimeout(function () { location.href = app; }, 300);
  })();
</script>
</body>
</html>
